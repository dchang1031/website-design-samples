<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/logo-without-title.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="TokenRouter Option 3 — Option 2 interactions with mono palette." />
    <title>TokenRouter - Option 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['\"PP Neue Montreal\"', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/src/replica.css" />
    <link rel="stylesheet" href="/src/option2-theme.css" />
    <link rel="stylesheet" href="/src/shared-nav.css" />
    <link rel="stylesheet" href="/src/option3-mono-palette.css" />
    <script>
      // Clone Option 2 DOM (same interactions) then apply mono palette class
      (async function bootOption3() {
        try {
          const res = await fetch("/option-2.html", { cache: "no-store" });
          const html = await res.text();
          const doc = new DOMParser().parseFromString(html, "text/html");
          const srcBody = doc.body;
          if (!srcBody) return;
          // adopt body children
          document.body.className = (srcBody.className || "theme-liquid") + " theme-mono-o3";
          document.body.innerHTML = srcBody.innerHTML;
          // ensure mono stylesheet
          if (!document.querySelector('link[href*="option3-mono-palette"]')) {
            const l = document.createElement("link");
            l.rel = "stylesheet";
            l.href = "/src/option3-mono-palette.css";
            document.head.appendChild(l);
          }
          // re-run page modules in order
          const mods = ["/src/replica.js", "/src/option2-scroll.js", "/src/design-brief.js"];
          for (const src of mods) {
            await import(src + "?v=o3");
          }
        } catch (e) {
          console.error("Option 3 boot failed", e);
          document.body.innerHTML = '<p style="padding:2rem">Failed to load Option 3. <a href="/option-2.html">Open Option 2</a></p>';
        }
      })();
    </script>
  </head>
  <body class="theme-liquid theme-mono-o3">
    <p style="padding:2rem;font-family:system-ui">Loading Option 3…</p>
  </body>
</html>
