<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/logo-without-title.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eceae6" />
    <meta name="description" content="TokenRouter Option 4 — former Option 1 design." />
    <title>TokenRouter - Option 4</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/shared-nav.css" />
    <script>
      (async function bootOption4() {
        const urls = [
          "https://raw.githubusercontent.com/dchang1031/website-design-samples/a940fae4d11b7640da71598b75fe51c776755ef2/tr-design-exercise/index.html",
        ];
        try {
          const res = await fetch(urls[0], { cache: "force-cache" });
          const html = await res.text();
          const doc = new DOMParser().parseFromString(html, "text/html");
          document.body.className = doc.body.className || "";
          document.body.innerHTML = doc.body.innerHTML;
          // Title
          document.title = "TokenRouter - Option 4";
          await import("/src/main.js?v=o4");
          await import("/src/replica.js?v=o4");
          await import("/src/design-brief.js?v=o4");
        } catch (e) {
          console.error(e);
          document.body.innerHTML =
            '<main class="page" style="padding:2rem"><p>Could not load Option 4.</p></main>';
        }
      })();
    </script>
  </head>
  <body>
    <p style="padding:2rem;font-family:system-ui">Loading Option 4…</p>
  </body>
</html>
