<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/logo-without-title.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="A unified AI model hub for aggregation and distribution. TokenRouter converts leading LLMs into OpenAI, Claude, and Gemini compatible APIs with centralized management for individuals and enterprises." />
    <title>TokenRouter — Current</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['\"PP Neue Montreal\"', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="/src/replica.css" />
    <link rel="stylesheet" href="/src/shared-nav.css" />
    <script>
      (async function bootCurrent() {
        try {
          const res = await fetch("/option-2.html", { cache: "no-store" });
          const html = await res.text();
          const doc = new DOMParser().parseFromString(html, "text/html");
          const srcBody = doc.body;
          if (!srcBody) throw new Error("no body");
          document.body.className = "";
          document.body.innerHTML = srcBody.innerHTML;
          // Strip Option-2-only motion chrome
          document.querySelectorAll(".scroll-stage, [data-value-story], .value-story").forEach((el) => el.remove());
          document.querySelectorAll(".scale-expand").forEach((sec) => {
            const content = sec.querySelector(".scale-expand__content");
            if (content) sec.replaceWith(...content.childNodes);
            else sec.remove();
          });
          document.body.classList.remove("theme-liquid", "theme-liquid--dark");
          delete document.body.dataset.theme;
          // Production modules only (no option2-scroll)
          await import("/src/replica.js?v=current");
          await import("/src/design-brief.js?v=current");
        } catch (e) {
          console.error(e);
          document.body.innerHTML =
            '<main style="padding:2rem;font-family:system-ui"><p>Could not load Current replica.</p><p><a href="/option-2.html">Option 2</a></p></main>';
        }
      })();
    </script>
  </head>
  <body>
    <p style="padding:2rem;font-family:system-ui">Loading Current…</p>
  </body>
</html>
